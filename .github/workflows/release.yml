# Builds the game for Windows and Linux, checks each build the way a
# player meets it, and on a version tag (v0.1.0) publishes them: a GitHub
# release with the archives, and, if an itch.io key is set, the itch page.
#
#   git tag v0.1.0 && git push origin v0.1.0     # build and publish
#   Actions tab -> release -> Run workflow        # build and check only
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            itch: windows
          - os: ubuntu-22.04          # an older glibc runs on more distributions
            itch: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20                 # a build takes a few minutes; a hang should not take hours
    continue-on-error: ${{ matrix.optional == true }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tk and a virtual screen (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtk8.6 xvfb

      - name: Tools
        run: python -m pip install pyinstaller==6.22.3 pillow

      - name: Build
        run: python tools/build.py

      - name: Check the build (selftest, then the real window)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python tools/ci_check.py "release/screenshot-${{ matrix.itch }}.png"
          else
            python tools/ci_check.py "release/screenshot-${{ matrix.itch }}.png"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: timeshare-${{ matrix.itch }}
          path: |
            release/timeshare-*
            release/screenshot-*

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the game's version
        run: |
          v=$(python3 -c "import main; print(main.VERSION)")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but main.VERSION is $v"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release notes from CHANGELOG.md
        run: python3 tools/release_notes.py "$GITHUB_REF_NAME" > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: artifacts/*/release/timeshare-*

      - name: itch.io (only if BUTLER_API_KEY and the ITCH_GAME variable are set)
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: |
          if [ -z "$BUTLER_API_KEY" ] || [ -z "$ITCH_GAME" ]; then
            echo "no itch.io key or game set: upload by hand (see RELEASING.md)"; exit 0
          fi
          curl -sL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          v=${GITHUB_REF_NAME#v}
          # unpack each archive and push it to the itch channel for its platform
          for f in artifacts/*/release/timeshare-*; do
            case "$f" in
              *windows*) channel=windows ;;
              *linux*) channel=linux ;;
              *) continue ;;
            esac
            mkdir -p "itch/$channel"
            case "$f" in
              *.zip) unzip -q "$f" -d "itch/$channel" ;;
              *.tar.gz) tar -xzf "$f" -C "itch/$channel" ;;
            esac
            ./butler/butler push "itch/$channel"/TIMESHARE-* "$ITCH_GAME:$channel" --userversion "$v"
          done
